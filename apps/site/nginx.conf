server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Pages are built as privacy.html, pro.html…: serve them at /privacy as well as /privacy.html
  # (the Play Console links use the .html form, see docs/PLAY-STORE.md).
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;

  # Hashed build assets and fonts never change under the same name.
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /fonts/  { expires 1y; add_header Cache-Control "public, immutable"; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
