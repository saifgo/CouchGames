# Couch server for Coolify ("Docker Compose" build pack) or plain `docker compose up -d`.
# Coolify: give the service a domain with the port, e.g. https://couch.example.com:8787.
# Coolify adds HTTPS and passes WebSockets through. See docs/DEPLOY.md.
services:
  couch:
    build:
      context: .
      args:
        WITH_CORES: "1"
        WITH_TEST_ROMS: "1"
    restart: unless-stopped
    # Map form: Coolify rewrites this block and chokes on value-less list entries.
    environment:
      PORT: "8787"
      COI: "1"
      STUN: "1"
      METADATA: ${METADATA:-1}
      # ROMs from an S3 bucket instead of the couch-roms volume (leave S3_BUCKET empty to
      # use the volume). Same layout under the prefix: <system>/<file>, BIOS in bios/.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Android TV app download on the TV page: put CoucheTV-*.apk in apps/ of the ROM storage,
      # or set an external link here.
      APK_URL: ${APK_URL:-}
    expose:
      - "8787"
    volumes:
      # Your games: roms/<system>/<file>, BIOS in roms/bios/. Never baked into the image.
      - couch-roms:/app/roms
      # No-Intro metadata cache, crash/latency logs.
      - couch-cache:/app/.cache

volumes:
  couch-roms:
  couch-cache:
