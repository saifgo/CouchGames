# Couch server for Coolify ("Docker Compose" build pack) or plain `docker compose up -d`.
# Coolify: SERVICE_FQDN_COUCH_8787 routes your domain (HTTPS + WebSockets) to port 8787.
# Set the domain on the service in the Coolify UI. See docs/DEPLOY.md.
services:
  couch:
    build:
      context: .
      args:
        WITH_CORES: "1"
        WITH_TEST_ROMS: "1"
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_COUCH_8787
      - PORT=8787
      - COI=1
      - STUN=1
      - METADATA=${METADATA:-1}
      - TELEMETRY_URL=${TELEMETRY_URL:-}
    expose:
      - "8787"
    volumes:
      # Your games: roms/<system>/<file>, BIOS in roms/bios/. Never baked into the image.
      - couch-roms:/app/roms
      # No-Intro metadata cache, crash/latency logs.
      - couch-cache:/app/.cache

volumes:
  couch-roms:
  couch-cache:
