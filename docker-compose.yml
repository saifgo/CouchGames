# Couch server for Coolify ("Docker Compose" build pack) or plain `docker compose up -d`.
# Coolify: give the service a domain with the port, e.g. https://couch.example.com:8787.
# Coolify adds HTTPS and passes WebSockets through. See docs/DEPLOY.md.
services:
  couch:
    build:
      context: .
      args:
        WITH_CORES: "1"
        WITH_TEST_ROMS: "1"
    restart: unless-stopped
    # Map form: Coolify rewrites this block and chokes on value-less list entries.
    environment:
      PORT: "8787"
      COI: "1"
      STUN: "1"
      METADATA: ${METADATA:-1}
    expose:
      - "8787"
    volumes:
      # Your games: roms/<system>/<file>, BIOS in roms/bios/. Never baked into the image.
      - couch-roms:/app/roms
      # No-Intro metadata cache, crash/latency logs.
      - couch-cache:/app/.cache

volumes:
  couch-roms:
  couch-cache:
