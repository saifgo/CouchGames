<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Couch · Arcade Pixel Art theme mockup</title>
<!-- Design mockup only (not app code). Open with ?sys=<id>, e.g. mockup.html?sys=snes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;700&family=Jersey+10&display=block" rel="stylesheet">
<style>
:root { --p: 4px; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
canvas { image-rendering: pixelated; display: block; }

/* ---------- shared layout (mirrors the real Home grid) ---------- */
.home {
  position: relative; width: 1920px; height: 1080px; overflow: hidden; display: grid;
  grid-template-columns: minmax(0, 1fr) 520px 400px;
  grid-template-rows: 84px minmax(0, 1fr) 118px 292px 62px;
  grid-template-areas: 'top top top' 'preview details players' 'platforms platforms platforms' 'wheel wheel wheel' 'hints hints hints';
  background: var(--bg); color: var(--text); font-family: var(--body-font); font-size: var(--body-size, 22px);
}
.home > * { position: relative; z-index: 1; min-width: 0; min-height: 0; }
.decor { position: absolute !important; inset: 0; z-index: 0 !important; pointer-events: none; }
.decor canvas { width: 100%; height: 100%; }

.topbar { grid-area: top; display: flex; align-items: center; gap: 24px; padding: 14px 40px 6px; }
.logo { display: flex; align-items: center; gap: 14px; font-family: var(--head-font); font-size: var(--logo-size, 30px); color: var(--logo, var(--text)); letter-spacing: 1px; }
.logo canvas { width: 40px; height: 40px; }
.theme-tag { font-family: var(--head-font); font-size: 14px; color: var(--muted); padding: 6px 12px; border: var(--p) solid var(--line); letter-spacing: 1px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 22px; }
.clock { font-family: var(--head-font); font-size: var(--clock-size, 22px); color: var(--text); }
.gear { width: 48px; height: 48px; }

.preview { grid-area: preview; display: flex; align-items: center; justify-content: center; padding: 10px 26px 22px 40px; }
.screen { position: relative; height: 100%; aspect-ratio: var(--ar, 4 / 3); max-width: 100%; background: #000; }
.screen canvas { width: 100%; height: 100%; }

.panel { position: relative; background: var(--panel); color: var(--text); padding: 26px 28px; }
.details { grid-area: details; margin: 10px 22px 22px 0; display: flex; flex-direction: column; }
.players { grid-area: players; margin: 10px 40px 22px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 22px; }

.d-title { margin: 0; font-family: var(--head-font); font-size: var(--title-size, 34px); line-height: 1.25; color: var(--title, var(--text)); font-weight: normal; }
.d-sys { margin: 12px 0 18px; font-family: var(--head-font); font-size: var(--sys-size, 16px); color: var(--accent); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 22px; margin: 0; padding-top: 16px; border-top: var(--p) var(--rule-style, dashed) var(--line); font-size: var(--facts-size, 26px); }
.facts dt { color: var(--muted); } .facts dd { margin: 0; white-space: nowrap; }
.press { margin: auto 0 0; display: flex; align-items: center; gap: 12px; font-family: var(--head-font); font-size: var(--press-size, 16px); color: var(--text); }
.press .blink { animation: none; }

.p-head { font-family: var(--head-font); font-size: var(--phead-size, 16px); color: var(--text); text-align: center; }
.qr { width: 196px; height: 196px; background: #fff; padding: 10px; }
.qr canvas { width: 100%; height: 100%; }
.code { font-family: var(--head-font); font-size: var(--code-size, 30px); color: var(--accent); letter-spacing: 6px; }
.url { font-size: var(--url-size, 22px); color: var(--muted); }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; margin-top: auto; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--head-font); font-size: 12px; color: var(--muted); }
.slot canvas { width: 52px; height: 52px; }
.slot.on { color: var(--text); }

.platforms { grid-area: platforms; display: flex; align-items: center; justify-content: center; gap: 14px; background: var(--strip); border-block: var(--p) solid var(--line); padding: 0 30px; overflow: hidden; }
.pf { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 16px; opacity: 0.45; }
.pf canvas { height: 44px; }
.pf b { font-family: var(--head-font); font-weight: normal; font-size: 14px; color: var(--pfc, var(--text)); white-space: nowrap; }
.pf.on { opacity: 1; background: var(--pf-on-bg, transparent); outline: var(--p) solid var(--focus); outline-offset: 0; }
.pf.on b { color: var(--focus); }

.wheel { grid-area: wheel; display: flex; align-items: flex-end; justify-content: center; gap: 34px; padding: 0 0 18px; }
.card { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0.75; position: relative; }
.card.on { opacity: 1; transform: translateY(-14px); }
.card-title { font-size: var(--ct-size, 20px); color: var(--muted); max-width: 190px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.on .card-title { color: var(--text); font-family: var(--head-font); font-size: 13px; }
.cursor { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); width: 40px; height: 32px; }

.hints { grid-area: hints; display: flex; align-items: center; gap: 30px; padding: 0 40px; background: var(--hintbar); border-top: var(--p) solid var(--line); font-family: var(--head-font); font-size: var(--hint-size, 14px); color: var(--text); }
.hints span { display: inline-flex; align-items: center; gap: 10px; }
.hints canvas { width: 32px; height: 32px; }
.hints .grow { flex: 1; }
.chip { padding: 8px 16px; border: var(--p) solid var(--line); color: var(--muted); }

/* stepped (pixel) corners */
.notch { clip-path: polygon(0 var(--p), var(--p) var(--p), var(--p) 0, calc(100% - var(--p)) 0, calc(100% - var(--p)) var(--p), 100% var(--p), 100% calc(100% - var(--p)), calc(100% - var(--p)) calc(100% - var(--p)), calc(100% - var(--p)) 100%, var(--p) 100%, var(--p) calc(100% - var(--p)), 0 calc(100% - var(--p))); }
.notch2 { clip-path: polygon(0 calc(var(--p)*2), var(--p) calc(var(--p)*2), var(--p) var(--p), calc(var(--p)*2) var(--p), calc(var(--p)*2) 0, calc(100% - var(--p)*2) 0, calc(100% - var(--p)*2) var(--p), calc(100% - var(--p)) var(--p), calc(100% - var(--p)) calc(var(--p)*2), 100% calc(var(--p)*2), 100% calc(100% - var(--p)*2), calc(100% - var(--p)) calc(100% - var(--p)*2), calc(100% - var(--p)) calc(100% - var(--p)), calc(100% - var(--p)*2) calc(100% - var(--p)), calc(100% - var(--p)*2) 100%, calc(var(--p)*2) 100%, calc(var(--p)*2) calc(100% - var(--p)), var(--p) calc(100% - var(--p)), var(--p) calc(100% - var(--p)*2), 0 calc(100% - var(--p)*2)); }

/* ---------- game media (cover frames) ---------- */
.media { position: relative; display: block; }
.media canvas.label { position: absolute; }
.ridges { position: absolute; background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 4px, transparent 4px 8px); }

/* ============================================================
   Per-console looks. Each one borrows the hardware's own language:
   body plastics, button colours, boot / menu UI, media shape.
   ============================================================ */

/* NES — grey toaster, black band, red buttons, RPG dialog boxes */
[data-sys=nes] { --bg:#000; --text:#fcfcfc; --muted:#bcbcbc; --accent:#f83800; --focus:#fcfcfc; --line:#fcfcfc; --panel:#000; --strip:#000; --hintbar:#000;
  --head-font:'Press Start 2P'; --body-font:'VT323'; --title-size:28px; --body-size:26px; }
[data-sys=nes] .panel { border: var(--p) solid #fcfcfc; box-shadow: 0 0 0 var(--p) #000, 0 0 0 calc(var(--p)*2) #bcbcbc; border-radius: 6px; }
[data-sys=nes] .topbar { background: #bcbcbc; color:#000; border-bottom: calc(var(--p)*3) solid #000; box-shadow: 0 calc(var(--p)*3) 0 #7c7c7c; }
[data-sys=nes] .topbar .logo, [data-sys=nes] .topbar .clock { color:#000; }
[data-sys=nes] .topbar .logo b { color:#f83800; }
[data-sys=nes] .theme-tag { color:#000; border-color:#000; }
[data-sys=nes] .platforms { border-color: #7c7c7c; background:#1c1c1c; }
[data-sys=nes] .pf.on { outline: none; background:#000; box-shadow: inset 0 0 0 var(--p) #fcfcfc; }
[data-sys=nes] .screen { box-shadow: 0 0 0 calc(var(--p)*3) #7c7c7c, 0 0 0 calc(var(--p)*5) #000, 0 0 0 calc(var(--p)*6) #bcbcbc; }
[data-sys=nes] .media.cart { width: 156px; height: 172px; background:#7c7c7c; box-shadow: inset calc(var(--p)*-2) calc(var(--p)*-2) 0 #4c4c4c, inset calc(var(--p)*2) calc(var(--p)*2) 0 #a4a4a4; }
[data-sys=nes] .media.cart canvas.label { left: 16px; top: 14px; width: 124px; height: 112px; }
[data-sys=nes] .media.cart .ridges { left: 16px; right: 16px; bottom: 10px; height: 28px; }

/* SNES — light grey + lavender, 4-colour face buttons, blue-gradient RPG windows, Mode 7 floor */
[data-sys=snes] { --bg:#18103a; --text:#ffffff; --muted:#c8c0e8; --accent:#ffd84a; --focus:#ffffff; --line:#cfc9e6; --panel:linear-gradient(#3848b8 0 12%, #3040a8 12% 30%, #283898 30% 50%, #203088 50% 70%, #182878 70% 88%, #102068 88%); --strip:#b9b4d0; --hintbar:#d6d3e2;
  --head-font:'Pixelify Sans'; --body-font:'Pixelify Sans'; --title-size:40px; --sys-size:22px; --press-size:22px; --phead-size:22px; --hint-size:20px; --logo-size:34px; --clock-size:28px; --facts-size:24px; }

  const card = el('div', 'card' + (i === 2 ? ' on' : ''));
  const m = el('span', 'media ' + mediaCls);
  const lw = { cart: 64, case: 80, umd: 64, dscard: 52, dvd: 64, hucard: 64 }[mediaCls];
  const lab = label(S, t, lw, Math.round(lw * 0.9)); lab.classList.add('label');
  if (mediaCls === 'case') m.append(el('span', 'spine'));
  if (mediaCls === 'dvd') m.append(el('span', 'band'));
  m.append(lab);
  if (mediaCls === 'cart') m.append(el('span', 'ridges'));
  if (mediaCls === 'umd') m.append(el('span', 'hole'));
  if (mediaCls === 'hucard') m.append(el('span', 'pins'));
  card.append(m, el('span', 'card-title', t));
  if (i === 2) { const cu = cursorSprite(); cu.className = 'cursor'; card.append(cu); }
  wh.append(card);
});
home.append(wh);

// hints
const hints = el('footer', 'hints');
const face = (id === 'psx' || id === 'ps2' || id === 'psp') ? [['crs', 'SELECT'], ['cir', 'BACK']] : id === 'snes' ? [['A', 'SELECT'], ['B', 'BACK']] : [['A', 'SELECT'], ['B', 'BACK']];
for (const [k, t] of face) { const s = el('span'); s.append(btnGlyph(k), document.createTextNode(t)); hints.append(s); }
hints.append(el('span', null, '✚ BROWSE'), el('span', 'grow'), el('span', 'chip', '12.4 GB FREE'), el('span', 'chip', '+ ADD GAMES'));
home.append(hints);
</script>
