<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Couch · Neon Arcade theme mockup</title>
<!-- Design mockup only (not app code). Open with ?look=synth|signs|grid&sys=<id>, e.g. neon.html?look=signs&sys=snes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Monoton&family=Rajdhani:wght@500;600;700&family=Tilt+Neon&family=Neonderthaw&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=block" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
canvas { image-rendering: pixelated; display: block; }

/* ---------- shared layout: identical for every look and every console ---------- */
.home {
  position: relative; width: 1920px; height: 1080px; overflow: hidden; display: grid;
  grid-template-columns: minmax(0, 1fr) 520px 400px;
  grid-template-rows: 84px minmax(0, 1fr) 118px 292px 62px;
  grid-template-areas: 'top top top' 'preview details players' 'platforms platforms platforms' 'wheel wheel wheel' 'hints hints hints';
  color: #fff; font-family: var(--body); font-size: 24px; line-height: 1.3;
  --glow: 0 0 2px #fff, 0 0 6px var(--n1), 0 0 16px var(--n1), 0 0 34px var(--n1);
  --glow2: 0 0 2px #fff, 0 0 6px var(--n2), 0 0 16px var(--n2), 0 0 34px var(--n2);
  --box: 0 0 0 2px var(--n1), 0 0 10px 1px var(--n1), 0 0 26px 2px var(--n1), inset 0 0 10px var(--n1);
  --box2: 0 0 0 2px var(--n2), 0 0 10px 1px var(--n2), 0 0 26px 2px var(--n2), inset 0 0 10px var(--n2);
}
.home > * { position: relative; z-index: 1; min-width: 0; min-height: 0; }
.decor { position: absolute !important; inset: 0; z-index: 0 !important; pointer-events: none; overflow: hidden; }

.topbar { grid-area: top; display: flex; align-items: center; gap: 26px; padding: 14px 40px 6px; }
.logo { font-family: var(--logo); font-size: 40px; color: #fff; text-shadow: var(--glow); letter-spacing: 2px; }
.tag { font-family: var(--head); font-size: 15px; letter-spacing: 2px; padding: 6px 14px; color: var(--n2); border-radius: 6px; box-shadow: 0 0 0 1px var(--n2), 0 0 10px var(--n2); text-shadow: 0 0 8px var(--n2); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 24px; }
.clock { font-family: var(--head); font-size: 28px; text-shadow: var(--glow2); }
.gear { width: 46px; height: 46px; border-radius: 50%; box-shadow: var(--box); }

.preview { grid-area: preview; display: flex; align-items: center; justify-content: center; padding: 14px 30px 26px 44px; }
.screen { position: relative; height: 100%; aspect-ratio: var(--ar, 4 / 3); max-width: 100%; background: #000; border-radius: 10px; box-shadow: var(--box); overflow: hidden; }
.screen canvas { width: 100%; height: 100%; }
.screen::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px); }

.panel { position: relative; border-radius: 12px; background: var(--panel); padding: 26px 30px; box-shadow: var(--box); }
.details { grid-area: details; margin: 14px 24px 26px 0; display: flex; flex-direction: column; }
.players { grid-area: players; margin: 14px 40px 26px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 22px; box-shadow: var(--box2); }
.d-title { margin: 0; font-family: var(--head); font-size: 40px; line-height: 1.2; color: #fff; text-shadow: var(--glow); font-weight: normal; white-space: nowrap; }
.d-sys { margin: 12px 0 18px; font-family: var(--head); font-size: 18px; letter-spacing: 3px; color: var(--n2); text-shadow: 0 0 10px var(--n2); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; margin: 0; padding-top: 16px; border-top: 2px solid var(--n1); box-shadow: 0 -6px 12px -8px var(--n1); font-size: 24px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; white-space: nowrap; }
.press { margin: auto 0 0; display: flex; align-items: center; gap: 14px; font-family: var(--head); font-size: 20px; letter-spacing: 2px; }
.btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--head); font-size: 18px; color: #fff; box-shadow: 0 0 0 2px var(--b, var(--n1)), 0 0 12px var(--b, var(--n1)), inset 0 0 10px var(--b, var(--n1)); text-shadow: 0 0 8px var(--b, var(--n1)); }
.press .btn { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 2px var(--b, var(--n1)), 0 0 26px 4px var(--b, var(--n1)), inset 0 0 14px var(--b, var(--n1)); } }

.p-head { font-family: var(--head); font-size: 20px; letter-spacing: 2px; text-align: center; color: var(--n2); text-shadow: 0 0 10px var(--n2); }
.qr { width: 196px; height: 196px; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 0 18px var(--n2); }
.qr canvas { width: 100%; height: 100%; }
.code { font-family: var(--head); font-size: 36px; letter-spacing: 8px; color: #fff; text-shadow: var(--glow2); }
.url { font-size: 21px; color: var(--muted); }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; margin-top: auto; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--head); font-size: 14px; color: var(--muted); }
.slot i { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 18px; box-shadow: 0 0 0 2px #ffffff22; color: #ffffff44; }
.slot.on { color: #fff; } .slot.on i { color: #fff; box-shadow: 0 0 0 2px var(--c), 0 0 14px var(--c), inset 0 0 10px var(--c); text-shadow: 0 0 8px var(--c); }

.platforms { grid-area: platforms; display: flex; align-items: center; justify-content: center; gap: 22px; padding: 0 30px; background: var(--strip); }
.platforms::before, .platforms::after { content: ''; position: absolute; left: 0; right: 0; height: 2px; background: var(--n1); box-shadow: 0 0 10px var(--n1), 0 0 22px var(--n1); }
.platforms::before { top: 0; } .platforms::after { bottom: 0; }
.pf { flex: 0 0 auto; width: 170px; height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; }
.pf b { font-family: var(--head); font-weight: normal; font-size: 24px; letter-spacing: 1px; white-space: nowrap; color: var(--off); }
.pf small { font-size: 16px; color: var(--off); }
.pf.on { box-shadow: var(--box); background: #00000055; }
.pf.on b { color: #fff; text-shadow: var(--glow); } .pf.on small { color: var(--n2); }

.wheel { grid-area: wheel; display: flex; align-items: flex-end; justify-content: center; gap: 34px; padding: 0 0 18px; }
.card { flex: 0 0 auto; width: 176px; display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; }
.cover { width: 160px; height: 213px; border-radius: 8px; overflow: hidden; position: relative; box-shadow: 0 0 0 2px #ffffff26; opacity: .72; }
.cover canvas { width: 100%; height: 100%; image-rendering: auto; }
.card.on .cover { opacity: 1; box-shadow: var(--box); }
.card-title { font-size: 21px; color: var(--muted); width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.on .card-title { color: #fff; text-shadow: var(--glow); }
.card.on::before { content: ''; position: absolute; top: -26px; left: 50%; width: 0; height: 0; transform: translateX(-50%); border: 10px solid transparent; border-top-color: var(--n2); filter: drop-shadow(0 0 6px var(--n2)); animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translate(-50%, 6px); } }

.hints { grid-area: hints; display: flex; align-items: center; gap: 30px; padding: 0 40px; background: var(--strip); font-family: var(--head); font-size: 18px; letter-spacing: 2px; }
.hints::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--n1); box-shadow: 0 0 10px var(--n1); }
.hints span { display: inline-flex; align-items: center; gap: 10px; }
.hints .btn { display: grid; width: 32px; height: 32px; font-size: 15px; }
.hints .grow { flex: 1; }
.chip { padding: 6px 18px; border-radius: 999px; color: var(--n2); box-shadow: 0 0 0 2px var(--n2), 0 0 10px var(--n2); text-shadow: 0 0 8px var(--n2); font-size: 16px; }

/* ============================================================
   LOOK 1 — SYNTHWAVE NIGHT: 80s sunset, chrome-neon type, laser grid floor
   ============================================================ */
[data-look=synth] { --logo: 'Monoton'; --head: 'Audiowide'; --body: 'Rajdhani'; --panel: linear-gradient(#140a2ccc, #08041acc); --strip: #07031299; --muted: #c9b3ff; --off: #8a76b8aa;
  background: linear-gradient(#05010f 0%, #12052e 38%, #2a0a4a 62%, #0a0318 63%, #05010f 100%); }
[data-look=synth] .facts, [data-look=synth] .url, [data-look=synth] .card-title { font-weight: 600; }
[data-look=synth] .sun { position: absolute; left: 50%; top: 410px; width: 640px; height: 640px; margin-left: -320px; border-radius: 50%;
  background: linear-gradient(var(--n2) 0%, var(--n1) 70%);
  -webkit-mask: linear-gradient(#000 0 40%, transparent 40% 43%, #000 43% 50%, transparent 50% 54%, #000 54% 59%, transparent 59% 64%, #000 64% 68%, transparent 68% 74%, #000 74% 77%, transparent 77%);
  filter: drop-shadow(0 0 40px var(--n1)); opacity: .55; }
[data-look=synth] .floor { position: absolute; left: -50%; right: -50%; top: 620px; height: 900px; transform-origin: top; transform: perspective(380px) rotateX(62deg);
  background: linear-gradient(90deg, transparent 0 calc(100% - 3px), var(--n1) 0) 0 0 / 90px 90px, linear-gradient(transparent 0 calc(100% - 3px), var(--n1) 0) 0 0 / 90px 90px;
  opacity: .38; -webkit-mask: linear-gradient(transparent, #000 10%, #000 60%, transparent); }
[data-look=synth] .stars { position: absolute; inset: 0 0 50% 0; background-image: radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent), radial-gradient(1px 1px at 30% 60%, #fff, transparent), radial-gradient(1.5px 1.5px at 55% 15%, #fff, transparent), radial-gradient(1px 1px at 70% 40%, #fff, transparent), radial-gradient(1.5px 1.5px at 85% 25%, #fff, transparent), radial-gradient(1px 1px at 45% 70%, #fff, transparent), radial-gradient(1px 1px at 20% 80%, #fff, transparent); background-size: 520px 300px; opacity: .7; }
[data-look=synth] .d-title { background: linear-gradient(#ffffff 0 45%, var(--n2) 46% 60%, var(--n1) 100%); -webkit-background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 8px var(--n1)); font-style: italic; }

/* ============================================================
   LOOK 2 — NEON SIGNS: arcade-hall brick wall, bent-glass tube lettering,
   unlit tubes for everything not focused
   ============================================================ */
[data-look=signs] { --logo: 'Neonderthaw'; --head: 'Tilt Neon'; --body: 'Tilt Neon'; --panel: #0b0a0eee; --strip: #0a090cf2; --muted: #b9b2c4; --off: #4a3f52;
  background-color: #1b1416;
  background-image: linear-gradient(#0000 0 calc(100% - 4px), #0e0a0b 0), linear-gradient(90deg, #0000 0 calc(100% - 4px), #0e0a0b 0);
  background-size: 120px 46px, 120px 92px; }
[data-look=signs] .decor { background: radial-gradient(ellipse at 30% 40%, color-mix(in srgb, var(--n1) 22%, transparent), transparent 55%), radial-gradient(ellipse at 80% 45%, color-mix(in srgb, var(--n2) 16%, transparent), transparent 50%), linear-gradient(#0000, #000a); }
[data-look=signs] .logo { font-size: 64px; letter-spacing: 0; margin-top: -6px; }
[data-look=signs] .d-title { font-family: 'Neonderthaw'; font-size: 66px; line-height: .95; margin-top: -8px; }
[data-look=signs] .panel { border-radius: 18px; }
[data-look=signs] .panel::before, [data-look=signs] .panel::after { content: ''; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(#9a9aa0, #3a3a40); top: 10px; left: 10px; }
[data-look=signs] .panel::after { left: auto; right: 10px; }
[data-look=signs] .pf:not(.on) b { text-shadow: none; }
[data-look=signs] .pf.on { background: none; box-shadow: none; }
[data-look=signs] .pf.on b { font-size: 24px; animation: flick 4s infinite; }
@keyframes flick { 0%, 7%, 9%, 100% { opacity: 1; } 8% { opacity: .35; } }
[data-look=signs] .screen { border-radius: 16px; }
[data-look=signs] .cover { border-radius: 4px; }

/* ============================================================
   LOOK 3 — CYBER GRID: black void, thin laser lines, HUD corner brackets
   ============================================================ */
[data-look=grid] { --logo: 'Orbitron'; --head: 'Orbitron'; --body: 'Share Tech Mono'; --panel: #02060bdd; --strip: #02050aee; --muted: #8fa3b8; --off: #33465a;
  background: #010306; }
[data-look=grid] .decor { background:
  linear-gradient(color-mix(in srgb, var(--n1) 10%, transparent) 1px, transparent 1px) 0 0 / 48px 48px,
  linear-gradient(90deg, color-mix(in srgb, var(--n1) 10%, transparent) 1px, transparent 1px) 0 0 / 48px 48px,
  radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--n1) 14%, transparent), transparent 60%); }
[data-look=grid] .logo { font-weight: 900; letter-spacing: 8px; font-size: 32px; }
[data-look=grid] .d-title { font-weight: 700; font-size: 34px; letter-spacing: 2px; text-transform: uppercase; }
[data-look=grid] .panel, [data-look=grid] .screen, [data-look=grid] .card.on .cover, [data-look=grid] .pf.on { border-radius: 0;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--n1) 45%, transparent), 0 0 24px -6px var(--n1); }
[data-look=grid] .players { box-shadow: 0 0 0 1px color-mix(in srgb, var(--n2) 45%, transparent), 0 0 24px -6px var(--n2); }
[data-look=grid] .hud::before, [data-look=grid] .hud::after { content: ''; position: absolute; width: 26px; height: 26px; border: 3px solid var(--c, var(--n1)); filter: drop-shadow(0 0 6px var(--c, var(--n1))); pointer-events: none; z-index: 2; }
[data-look=grid] .hud::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
[data-look=grid] .hud::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
[data-look=grid] .players.hud { --c: var(--n2); }
[data-look=grid] .tag, [data-look=grid] .chip, [data-look=grid] .gear, [data-look=grid] .qr, [data-look=grid] .cover { border-radius: 0; }
[data-look=grid] .btn, [data-look=grid] .slot i { border-radius: 4px; transform: rotate(45deg); }
[data-look=grid] .btn > *, [data-look=grid] .slot i > * { transform: rotate(-45deg); }
[data-look=grid] .facts { border-top-style: dashed; border-top-width: 1px; }
[data-look=grid] .platforms::before, [data-look=grid] .platforms::after, [data-look=grid] .hints::before { height: 1px; }

/* ============================================================
   Per-console neon palettes (colours only — geometry never changes).
   n1 = main tube, n2 = second tube, btn colours = the pad's own buttons.
   ============================================================ */
[data-sys=nes]       { --n1: #ff2b3a; --n2: #f2f2f2; --bA: #ff2b3a; --bB: #ff2b3a; }
[data-sys=snes]      { --n1: #a46bff; --n2: #ffd23f; --bA: #ff3b3b; --bB: #ffd23f; }
[data-sys=genesis]   { --n1: #2f8bff; --n2: #ff2a2a; --bA: #c8d0e0; --bB: #c8d0e0; }
[data-sys=gb]        { --n1: #8cff2e; --n2: #ff3aa8; --bA: #ff3aa8; --bB: #ff3aa8; }
[data-sys=gbc]       { --n1: #b46bff; --n2: #00ffd5; --bA: #ffd400; --bB: #ffd400; }
[data-sys=gba]       { --n1: #6c5cff; --n2: #ff5ce1; --bA: #c9c6ff; --bB: #c9c6ff; --ar: 3 / 2; }
[data-sys=psx]       { --n1: #3a8bff; --n2: #ff3a5c; --bA: #6ea8ff; --bB: #ff3a5c; }
[data-sys=n64]       { --n1: #ffcc00; --n2: #2aff6a; --bA: #3a6bff; --bB: #2aff6a; }
[data-sys=psp]       { --n1: #7fd4ff; --n2: #ffffff; --bA: #6ea8ff; --bB: #ff3a5c; --ar: 16 / 9; }
[data-sys=nds]       { --n1: #4ac8ff; --n2: #e4e8ee; --bA: #ff3b3b; --bB: #ffd23f; }
[data-sys=ps2]       { --n1: #2f5cff; --n2: #9fb8ff; --bA: #6ea8ff; --bB: #ff3a5c; }
[data-sys=atari2600] { --n1: #ff8a1e; --n2: #ffd08a; --bA: #ff3b1e; --bB: #ff3b1e; }
[data-sys=pce]       { --n1: #ff6a1f; --n2: #ffffff; --bA: #ff6a1f; --bB: #ff6a1f; }

/* ---------- console branding (absolutely placed or inside fixed boxes: never moves layout) ---------- */
.marquee { position: absolute; left: 50%; top: 8px; width: 560px; height: 68px; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; pointer-events: none; }
.marquee img { max-height: 50px; max-width: 470px; filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px var(--n1)) drop-shadow(0 0 22px var(--n1)); }
.marquee .txt { font-family: var(--head); font-size: 40px; color: #fff; text-shadow: var(--glow); letter-spacing: 3px; }
[data-look=signs] .marquee { background: #0c0a0ee6; border-radius: 14px; box-shadow: 0 0 0 2px #2a2430, 0 10px 30px #000c; }
[data-look=signs] .marquee::before, [data-look=signs] .marquee::after { content: ''; position: absolute; top: -12px; width: 2px; height: 12px; background: #4a4450; }
[data-look=signs] .marquee::before { left: 60px; } [data-look=signs] .marquee::after { right: 60px; }
[data-look=grid] .marquee { box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--n1) 60%, transparent); }
.pf { gap: 6px; }
.pf img { height: 36px; max-width: 150px; object-fit: contain; filter: grayscale(1) brightness(.75) opacity(var(--unlit, .3)); }
.pf .txt { font-family: var(--head); font-size: 22px; color: var(--off); line-height: 36px; height: 36px; white-space: nowrap; }
.pf.on img { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px var(--n1)) drop-shadow(0 0 16px var(--n1)); }
.pf.on .txt { color: #fff; text-shadow: var(--glow); }
[data-look=signs] { --unlit: .24; }
.motif { position: absolute; top: 744px; width: 214px; height: 262px; }
.motif.l { left: 14px; } .motif.r { right: 14px; }
.motif svg { width: 100%; height: 100%; overflow: visible; }
[data-look=grid] .motif { opacity: .85; }
.btn b { font-weight: normal; }
</style>
</head>
<body>
<div class="home" id="home"></div>
<script>
const SYS = {
  nes: ['NES', 'Nintendo Entertainment System', 'Nintendo', 1985],
  snes: ['SNES', 'Super Nintendo', 'Nintendo', 1990],
  genesis: ['Genesis', 'Sega Genesis', 'Sega', 1988],
  gb: ['Game Boy', 'Game Boy', 'Nintendo', 1989],
  gbc: ['GB Color', 'Game Boy Color', 'Nintendo', 1998],
  gba: ['GBA', 'Game Boy Advance', 'Nintendo', 2001],
  psx: ['PS1', 'PlayStation', 'Sony', 1994],
  n64: ['N64', 'Nintendo 64', 'Nintendo', 1996],
  psp: ['PSP', 'PlayStation Portable', 'Sony', 2004],
  nds: ['DS', 'Nintendo DS', 'Nintendo', 2004],
  ps2: ['PS2', 'PlayStation 2', 'Sony', 2000],
  atari2600: ['2600', 'Atari 2600', 'Atari', 1977],
  pce: ['PCE', 'PC Engine', 'NEC', 1987],
};
const ORDER = Object.keys(SYS);
const GAMES = ['Star Rescue', 'Moon Bricks', 'Pixel Knight', 'Turbo Lane', 'Cave Story Jr', 'Ghost Garden', 'Neon Drift'];
const q = new URLSearchParams(location.search);
const sys = SYS[q.get('sys')] ? q.get('sys') : 'snes';
const look = ['synth', 'signs', 'grid'].includes(q.get('look')) ? q.get('look') : 'synth';
const LOOK_NAME = { synth: 'Synthwave Night', signs: 'Neon Signs', grid: 'Cyber Grid' }[look];
const S = SYS[sys];
const home = document.getElementById('home'); home.dataset.sys = sys; home.dataset.look = look;
const css = (v) => getComputedStyle(home).getPropertyValue(v).trim();
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
function rng(seed) { let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

// decor
const decor = el('div', 'decor'); home.append(decor);
if (look === 'synth') decor.append(el('div', 'stars'), el('div', 'sun'), el('div', 'floor'));


// ---------- console branding ----------
const LOGO = (k) => `../../../packages/systems/logos/${k}.svg`;
const HAS_LOGO = new Set(['nes','snes','genesis','gb','gbc','gba','psx','n64','psp','nds','ps2','atari2600']);
// select/back buttons as printed on each console's pad
const BTN = { nes:[['A','#ff2b3a'],['B','#ff2b3a']], snes:[['A','#ff3b3b'],['B','#ffd23f']], genesis:[['C','#dfe6f2'],['B','#dfe6f2']],
  gb:[['A','#ff3aa8'],['B','#ff3aa8']], gbc:[['A','#ffd400'],['B','#ffd400']], gba:[['A','#c9c6ff'],['B','#c9c6ff']],
  psx:[['✕','#6ea8ff'],['○','#ff3a5c']], ps2:[['✕','#6ea8ff'],['○','#ff3a5c']], psp:[['✕','#6ea8ff'],['○','#ff3a5c']],
  n64:[['A','#3a6bff'],['B','#2aff6a']], nds:[['A','#ff3b3b'],['B','#ffd23f']], atari2600:[['●','#ff3b1e'],['↺','#ffd08a']], pce:[['I','#ff6a1f'],['II','#ff6a1f']] }[sys];
const btn = ([l, c]) => `<span class="btn" style="--b:${c}"><b>${l}</b></span>`;

  gba: [G('#6c5cff','<path d="M10 90 Q10 60 40 60 H160 Q190 60 190 90 V160 Q190 190 160 190 H40 Q10 190 10 160 Z"/><rect x="62" y="85" width="76" height="80"/>') + G('#c9c6ff','<path d="M20 70 Q30 40 60 42 M180 70 Q170 40 140 42"/>'),
        G('#c9c6ff','<circle cx="70" cy="140" r="26"/><circle cx="135" cy="105" r="26"/>') + T('#c9c6ff',70,151,30,'B') + T('#c9c6ff',135,116,30,'A') + T('#ff5ce1',100,215,22,'L · R')],

  n64: [G('#ffcc00','<path d="M100 40 l18 22 h-36 Z M100 140 l18 -22 h-36 Z M50 90 l22 -18 v36 Z M150 90 l-22 -18 v36 Z"/>') + G('#3a6bff','<circle cx="70" cy="190" r="22"/>') + G('#2aff6a','<circle cx="135" cy="185" r="18"/>') + T('#3a6bff',70,200,26,'A') + T('#2aff6a',135,194,22,'B'),
        G('#8e929c','<path d="M20 60 H180 V200 H20 Z"/><rect x="45" y="90" width="110" height="80"/>') + G('#ff2a2a','<path d="M30 45 h35"/>',4) + G('#ffcc00','<path d="M70 45 h35"/>',4) + G('#2aff6a','<path d="M110 45 h35"/>',4) + G('#3a6bff','<path d="M150 45 h20"/>',4)],

// preview: a neutral pixel shmup screenshot (the game's own picture, not themed)
const prev = el('section', 'preview'); const scr = el('div', 'screen');
(function () {
  const [c, x] = cv(256, 192); const r = rng('shot'); x.fillStyle = '#060818'; x.fillRect(0, 0, 256, 192);
  for (let i = 0; i < 70; i++) { x.fillStyle = r() < .3 ? '#ffffff' : '#5a6aa8'; x.fillRect(r() * 256 | 0, r() * 192 | 0, 1, 1); }
  x.fillStyle = '#2a1c5a'; for (let i = 0; i < 256; i += 2) { const h = 20 + Math.sin(i / 17) * 8 + Math.sin(i / 7) * 3; x.fillRect(i, 192 - h, 2, h); }
  const ship = ['...a...', '..aba..', '.aabaa.', 'aacacaa', 'a.a.a.a']; ship.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { x.fillStyle = { a: '#d8e0ff', b: '#ff4060', c: '#ffb020' }[ch]; x.fillRect(120 + i * 2, 140 + j * 2, 2, 2); } }));
  const inv = ['.a...a.', '..aaa..', '.abaab.', 'aaaaaaa', 'a.a.a.a'];
  [[40, 40, '#40e0a0'], [90, 30, '#ff60c0'], [150, 46, '#40e0a0'], [200, 32, '#ffd040'], [70, 74, '#ff60c0'], [180, 80, '#40e0a0']].forEach(([ox, oy, col]) => inv.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { x.fillStyle = ch === 'b' ? '#000' : col; x.fillRect(ox + i * 2, oy + j * 2, 2, 2); } })));

})();

// wheel of covers (cover art is the game's own; frame glows)
const wh = el('section', 'wheel');
function cover(title, seed) {
  const [c, x] = cv(320, 426); const r = rng(seed); const hue = r() * 360;
  const g = x.createLinearGradient(0, 0, 0, 426); g.addColorStop(0, `hsl(${hue},60%,22%)`); g.addColorStop(1, `hsl(${(hue + 60) % 360},70%,8%)`); x.fillStyle = g; x.fillRect(0, 0, 320, 426);
  x.fillStyle = `hsl(${(hue + 180) % 360},80%,60%)`; x.beginPath(); x.arc(160, 250, 70 + r() * 30, 0, Math.PI * 2); x.fill();
  x.fillStyle = `hsl(${hue},50%,12%)`; for (let i = 0; i < 320; i += 8) { const h = 40 + r() * 60; x.fillRect(i, 426 - h, 8, h); }
  x.fillStyle = '#fff'; x.font = 'bold 34px Rajdhani, sans-serif'; x.textAlign = 'center'; x.fillText(title.toUpperCase(), 160, 70);
  return c;
}
GAMES.forEach((t, i) => { const card = el('div', 'card' + (i === 2 ? ' on' : '')); const cvr = el('div', 'cover'); if (i % 3 === 1) { const im = new Image(); im.src = `../../../packages/systems/covers/${sys}.svg`; im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block'; cvr.append(im); } else cvr.append(cover(t, t)); card.append(cvr, el('div', 'card-title', t)); wh.append(card); });
